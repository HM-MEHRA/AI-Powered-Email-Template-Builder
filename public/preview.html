<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: #f8fafc;
        background: linear-gradient(135deg, #020617 0%, #111827 52%, #0f766e 100%);
      }

      .loader {
        width: min(520px, calc(100vw - 36px));
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        padding: 28px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      }

      .eyebrow {
        margin: 0;
        color: #a7f3d0;
        font: 700 12px/1.4 Arial, sans-serif;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 0;
        font-size: 30px;
        line-height: 1.2;
      }

      .bar {
        height: 10px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }

      .bar::before {
        content: "";
        display: block;
        width: 46%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #38bdf8, #34d399, #f97316);
        animation: load 1.1s ease-in-out infinite;
      }

      @keyframes load {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(230%);
        }
      }

    </style>
  </head>
  <body>
    <main class="loader">
      <p class="eyebrow">Preview</p>
      <h1 id="preview-title">Preparing your email</h1>
      <div class="bar" aria-hidden="true"></div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var title = params.get("title");
        var previewTitle = document.getElementById("preview-title");
        var lastPreviewHtml = "";

        if (title) {
          previewTitle.textContent = title;
          document.title = title;
        }

        function copyParsedHead(parsedDocument) {
          Array.from(document.head.querySelectorAll("[data-preview-style]")).forEach(function (node) {
            node.remove();
          });

          var title = parsedDocument.querySelector("title");
          if (title && title.textContent) {
            document.title = title.textContent;
          }

          Array.from(parsedDocument.head.querySelectorAll("style")).forEach(function (styleNode) {
            var nextStyle = document.createElement("style");
            nextStyle.setAttribute("data-preview-style", "true");
            nextStyle.textContent = styleNode.textContent;
            document.head.appendChild(nextStyle);
          });
        }

        function renderPreview(html) {
          if (!html) return;
          if (html === lastPreviewHtml) return;
          lastPreviewHtml = html;

          var parsedDocument = new DOMParser().parseFromString(html, "text/html");
          copyParsedHead(parsedDocument);

          document.body.removeAttribute("class");
          document.body.removeAttribute("style");
          if (parsedDocument.body.getAttribute("class")) {
            document.body.className = parsedDocument.body.getAttribute("class");
          }
          if (parsedDocument.body.getAttribute("style")) {
            document.body.setAttribute("style", parsedDocument.body.getAttribute("style"));
          }
          document.body.style.display = "block";
          document.body.style.placeItems = "normal";

          document.body.innerHTML = "";
          Array.from(parsedDocument.body.childNodes).forEach(function (node) {
            document.body.appendChild(document.importNode(node, true));
          });
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin) return;
          if (!event.data || event.data.type !== "EMAIL_BUILDER_PREVIEW_HTML") return;
          renderPreview(event.data.html);
          if (event.source) {
            event.source.postMessage({ type: "EMAIL_BUILDER_PREVIEW_READY" }, event.origin);
          }
        });
      })();
    </script>
  </body>
</html>
